# ============================================================
# SevaSetu AI — Docker Compose (Full Stack)
# Author: Rahul Jha | Made in India 🇮🇳
#
# Services:
#   frontend  - React.js (Nginx, port 3000)
#   backend   - FastAPI (Uvicorn, port 8000)
#   db        - MySQL 8.0 (port 3306)
#   redis     - Redis 7 (port 6379)
#   chromadb  - ChromaDB vector store (port 8001)
#
# Usage:
#   docker-compose up --build
#   docker-compose up -d   (detached / production)
# ============================================================

version: "3.9"

networks:
  sevasetu-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  chroma_data:
  upload_data:
  report_data:

services:

  # ── MySQL Database ─────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: sevasetu_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: sevasetu_db
      MYSQL_USER: sevasetu
      MYSQL_PASSWORD: ${DB_PASSWORD:-sevasetupwd}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max_allowed_packet=64M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sevasetu-net

  # ── Redis Cache ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sevasetu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sevasetu-net

  # ── ChromaDB Vector Store ──────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: sevasetu_chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_AUTH_CREDENTIALS_FILE=/chroma/auth
      - ALLOW_RESET=TRUE
      - IS_PERSISTENT=TRUE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sevasetu-net

  # ── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sevasetu_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "mysql+asyncmy://sevasetu:${DB_PASSWORD:-sevasetupwd}@db:3306/sevasetu_db"
      REDIS_URL: "redis://redis:6379"
      CHROMA_PERSIST_DIR: "/app/data/chroma_db"
      SECRET_KEY: ${SECRET_KEY:-sevasetu-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      UPLOAD_DIR: "/app/uploads"
      REPORT_DIR: "/app/reports"
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALLOWED_ORIGINS: '["http://localhost:3000","https://sevasetu.ai"]'
    volumes:
      - upload_data:/app/uploads
      - report_data:/app/reports
      - chroma_data:/app/data/chroma_db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sevasetu-net

  # ── React Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${API_URL:-http://localhost:8000}
        REACT_APP_APP_NAME: "SevaSetu AI"
        REACT_APP_VERSION: "1.0.0"
    container_name: sevasetu_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - sevasetu-net

  # ── Nginx Reverse Proxy (Production) ──────────────────────
  nginx:
    image: nginx:alpine
    container_name: sevasetu_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sevasetu-net
    profiles:
      - production   # Only starts with: docker-compose --profile production up
